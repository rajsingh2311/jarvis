<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<script src="api.js?v=202611132149"></script>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --line:#23314f; --text:#e6edf8; --muted:#94a3c0; --accent:#38bdf8; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  a { color:var(--accent); }
  .shell { display:flex; min-height:100vh; }
  nav.side { width:200px; flex:0 0 200px; background:var(--panel); border-right:1px solid var(--line); padding:16px 10px; position:sticky; top:0; height:100vh; }
  nav.side h1 { font-size:16px; margin:4px 8px 18px; letter-spacing:.4px; }
  nav.side h1 span { color:var(--accent); }
  nav.side button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--muted); padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:2px; }
  nav.side button.on { background:var(--panel2); color:var(--text); font-weight:600; }
  nav.side .badge { float:right; background:var(--accent); color:#04121f; border-radius:999px; padding:0 7px; font-size:12px; font-weight:700; }
  main { flex:1; min-width:0; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:10px; align-items:center; }
  .top input { flex:1; }
  .page { padding:20px; max-width:1100px; }
  h2 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:15px; }
  .stat { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .stat div { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-width:120px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  input, textarea, select { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .btn { background:var(--accent); color:#04121f; border:none; border-radius:10px; padding:9px 14px; font-weight:600; cursor:pointer; white-space:nowrap; font:inherit; font-weight:600; }
  .btn.ghost { background:none; color:var(--text); border:1px solid var(--line); font-weight:500; }
  .btn.small { padding:5px 10px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > input, .row > select { flex:1; min-width:140px; }
  .item { border-top:1px solid var(--line); padding:10px 0; }
  .item:first-child { border-top:none; }
  .item .t { font-weight:600; }
  .item .m { color:var(--muted); font-size:12px; margin-top:2px; }
  .item .x { margin-top:6px; white-space:pre-wrap; line-height:1.45; }
  .item .acts { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:12px; color:var(--muted); margin:2px 4px 2px 0; cursor:pointer; background:none; }
  .chip.on { background:var(--accent); color:#04121f; border-color:var(--accent); }
  .acct { display:inline-block; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:600; color:#04121f; }
  .answer { background:var(--panel2); border:1px solid var(--accent); border-radius:12px; padding:14px; margin:14px 0; font-size:15px; line-height:1.5; }
  mark { background:rgba(56,189,248,.28); color:inherit; border-radius:3px; padding:0 2px; }
  .muted { color:var(--muted); }
  .over { color:var(--bad); font-weight:600; }
  .ok { color:var(--good); font-weight:600; }
  .unread .t { color:#fff; }
  .unread { border-left:3px solid var(--accent); padding-left:10px; }
  .chat { display:flex; flex-direction:column; gap:10px; min-height:40vh; padding-bottom:12px; }
  .bubble { padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; max-width:85%; word-wrap:break-word; }
  .bubble.me { background:#1e3a5f; align-self:flex-end; }
  .bubble.jv { background:var(--panel2); border:1px solid var(--line); align-self:flex-start; }
  .bubble.jv:before { content:"JARVIS"; display:block; font-size:10px; letter-spacing:2px; color:var(--accent); font-weight:700; margin-bottom:4px; }
  .bubble.fmt { white-space:normal; }
  .bubble .h { font-weight:700; color:#fff; margin:8px 0 3px; }
  .bubble .h.first { margin-top:0; font-size:15px; }
  .bubble .li { padding-left:16px; position:relative; margin:2px 0; }
  .bubble .li:before { content:"•"; position:absolute; left:3px; color:var(--accent); }
  .bubble .fix { font-style:italic; color:var(--muted); border-left:3px solid var(--warn); padding-left:8px; margin-bottom:8px; }
  .bubble .sp { height:6px; }
  .bubble b { color:#fff; }
  .bubble code { background:rgba(56,189,248,.15); border-radius:4px; padding:0 4px; font-family:Consolas,monospace; font-size:13px; }
  .composer { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
  .composer textarea { min-height:44px; height:44px; }
  .aimode { font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); }
  .aimode.on { color:var(--good); border-color:var(--good); }
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cal .hd { text-align:center; color:var(--muted); font-size:12px; padding:4px 0; }
  .cal .day { min-height:84px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; cursor:pointer; overflow:hidden; }
  .cal .day.out { opacity:.35; }
  .cal .day.today { border-color:var(--accent); }
  .cal .day.sel { background:var(--panel2); box-shadow:inset 0 0 0 2px var(--accent); }
  .cal .num { font-size:12px; font-weight:700; color:var(--muted); }
  .cal .day.today .num { color:var(--accent); }
  .cal .ev { font-size:11px; background:rgba(56,189,248,.18); border-radius:5px; padding:1px 5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal .more { font-size:11px; color:var(--muted); margin-top:2px; }
  .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .formgrid .full { grid-column:1 / -1; }
  @media (max-width: 760px) { .cal .day { min-height:52px; padding:4px; } .cal .ev { display:none; } .cal .day.has .num:after { content:" •"; color:var(--accent); } .formgrid { grid-template-columns:1fr; } }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--line); padding:12px 16px; border-radius:12px; display:none; z-index:20; max-width:360px; }
  .hide { display:none; }
  .bell { position:relative; }
  .bell .badge { position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; font-size:11px; font-weight:700; }
  .pops { position:fixed; top:64px; right:16px; z-index:30; display:flex; flex-direction:column; gap:8px; max-width:340px; }
  .pop { background:var(--panel2); border:1px solid var(--accent); border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .pop.k-security { border-color:var(--bad); }
  .pop.k-reminder { border-color:var(--warn); }
  .pop b { display:block; margin-bottom:4px; }
  .pop .acts { margin-top:8px; display:flex; gap:6px; }
  @media (max-width: 760px) {
    .pops { left:14px; right:14px; max-width:none; }
    .shell { display:block; }
    nav.side { position:fixed; bottom:0; top:auto; left:0; right:0; width:auto; height:auto; display:flex; overflow-x:auto; padding:6px; z-index:10; border-right:none; border-top:1px solid var(--line); }
    nav.side h1 { display:none; }
    nav.side button { width:auto; flex:0 0 auto; text-align:center; font-size:12px; padding:8px 10px; }
    .page { padding:14px 14px 90px; }
    .top { padding:10px 14px; }
    nav.side { padding-bottom:calc(6px + env(safe-area-inset-bottom)); scrollbar-width:none; }
    nav.side::-webkit-scrollbar { display:none; }
    input, textarea, select { font-size:16px; }
    .top { gap:6px; }
    .top .btn { padding:9px 10px; }
    h2 { font-size:18px; }
    .grid { grid-template-columns:1fr; gap:12px; }
    .card { padding:13px; border-radius:12px; }
    .stat { gap:8px; }
    .stat div { flex:1 1 calc(50% - 8px); min-width:0; padding:10px 12px; }
    .stat b { font-size:20px; }
    .bubble { max-width:94%; font-size:15px; }
    .chat { min-height:30vh; }
    .composer { bottom:calc(52px + env(safe-area-inset-bottom)); padding:8px 0; }
    .composer textarea { font-size:16px; }
    .row > input, .row > select { min-width:0; flex:1 1 100%; }
    .item .acts .btn { flex:1 1 auto; }
    .toast { left:14px; right:14px; bottom:76px; max-width:none; }
    .pops { top:58px; }
    .answer { font-size:14px; }
    img, table { max-width:100%; }
    html, body { overflow-x:hidden; }
  }
  @media (max-width: 380px) {
    nav.side button { padding:8px 7px; font-size:11px; }
    .stat div { flex:1 1 100%; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="nav">
    <h1>COMMAND<span>.</span></h1>
    <button data-p="home" class="on">Home</button>
    <button data-p="jarvis">Jarvis</button>
    <button data-p="alerts">Alerts <span class="badge hide" id="b-alerts"></span></button>
    <button data-p="calendar">Calendar</button>
    <button data-p="ask">Ask</button>
    <button data-p="memory">Memory</button>
    <button data-p="inbox">Inbox <span class="badge hide" id="b-unread"></span></button>
    <button data-p="tasks">Tasks <span class="badge hide" id="b-tasks"></span></button>
    <button data-p="settings">Settings</button>
  </nav>
  <main>
    <div class="top">
      <input id="gsearch" placeholder="Search everything: notes, mail, tasks (Enter)">
      <button class="btn ghost" id="gsearch-go">Search</button>
      <button class="btn ghost bell" id="bell" title="Alerts">🔔<span class="badge hide" id="b-bell"></span></button>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="pops" id="pops"></div>

<script>
var state = { page: 'home', tag: '', inbox: { account: '', category: '', unread: false } };
var CATS = ['Needs reply', 'Bills', 'OTP & security', 'Newsletters', 'Suspicious', 'Other'];

function $(id) { return document.getElementById(id); }
var RX_BOLD = new RegExp('\\*\\*([^*\\n]+?)\\*\\*', 'g');
var RX_CODE = new RegExp('`([^`\\n]+)`', 'g');
var RX_EMOJI = new RegExp('^\\p{Extended_Pictographic}', 'u');
function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmtInline(s) { return escHtml(s).replace(RX_BOLD, '<b>$1</b>').replace(RX_CODE, '<code>$1</code>'); }
function fmtReply(text) {
  var lines = String(text || '').replace(/\r/g, '').split('\n');
  var out = [], firstDone = false;
  lines.forEach(function (line, i) {
    var t = line.trim();
    if (!t) { if (out.length) out.push('<div class="sp"></div>'); return; }
    if (t.indexOf('✏') === 0) { out.push('<div class="fix">' + fmtInline(t) + '</div>'); return; }
    var isHash = /^#{1,6}\s+\S/.test(t);
    var isHead = isHash || (t.length <= 80 && /:$/.test(t) && (RX_EMOJI.test(t) || t.indexOf('**') === 0)) ||
      (!firstDone && t.length <= 90 && RX_EMOJI.test(t) && lines.length > 1) ||
      (!firstDone && t.length <= 120 && /:$/.test(t) && lines.length > 1);
    if (isHead) {
      out.push('<div class="h' + (firstDone ? '' : ' first') + '">' + fmtInline(t.replace(/^#{1,6}\s+/, '').split('**').join('')) + '</div>');
      firstDone = true; return;
    }
    firstDone = true;
    var m = t.match(/^[-*•]\s+(.*)$/);
    if (m) { out.push('<div class="li">' + fmtInline(m[1]) + '</div>'); return; }
    out.push('<div>' + fmtInline(t) + '</div>');
  });
  return out.join('');
}

function el(tag, props, kids) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    if (k === 'text') e.textContent = props[k];
    else if (k === 'cls') e.className = props[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { toast('Error: ' + (e && e.message ? e.message : e)); fail(e); });
    r[fn].apply(r, args);
  });
}
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function page(title, sub) {
  var p = $('page'); p.textContent = '';
  p.appendChild(el('h2', { text: title }));
  if (sub) p.appendChild(el('p', { cls: 'sub', text: sub }));
  return p;
}
function loading(p) { p.appendChild(el('p', { cls: 'muted', text: 'Loading...' })); }
function card(title, kids) { return el('div', { cls: 'card' }, [title ? el('h3', { text: title }) : null].concat(kids || [])); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlight(text, words) {
  var frag = document.createDocumentFragment();
  var roots = (words || []).filter(function (w) { return w && w.length >= 3 && w.charAt(0) !== '#'; })
    .map(function (w) { return escRe(w.slice(0, Math.max(3, w.length - 1))); });
  if (!roots.length) { frag.appendChild(document.createTextNode(text)); return frag; }
  var re = new RegExp('(' + roots.join('|') + ')[a-z]*', 'gi');
  var last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    frag.appendChild(el('mark', { text: m[0] }));
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function acctChip(addr, colours) {
  var c = (colours && colours[addr]) || '#94a3c0';
  var s = el('span', { cls: 'acct', text: addr.split('@')[0] });
  s.style.background = c;
  return s;
}

document.querySelectorAll('#nav button').forEach(function (b) {
  b.addEventListener('click', function () { go(b.getAttribute('data-p')); });
});
function go(p) {
  state.page = p;
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === p); });
  ({ home: showHome, jarvis: showJarvis, alerts: showAlerts, calendar: showCalendar, ask: showAsk, memory: showMemory, inbox: showInbox, tasks: showTasks, settings: showSettings })[p]();
  window.scrollTo(0, 0);
}

function noteItem(n, words, onChange) {
  var body = el('div', { cls: 'x' });
  body.appendChild(highlight(n.snippet || n.text, words));
  var meta = [n.type, n.created].concat(n.tags).filter(Boolean).join(' · ');
  var facts = [];
  if (n.dates.length) facts.push('Dates: ' + n.dates.join(', '));
  if (n.amounts.length) facts.push('Amounts: ' + n.amounts.join(', '));
  if (n.contacts.length) facts.push('Contacts: ' + n.contacts.join(', '));
  var acts = el('div', { cls: 'acts' }, [
    el('button', { cls: 'btn ghost small', text: n.pinned ? 'Unpin' : 'Pin', onclick: function () { call('pinNote', n.id, !n.pinned).then(onChange); } }),
    el('button', { cls: 'btn ghost small', text: 'Edit', onclick: function () { editNote(n); } }),
    el('button', { cls: 'btn ghost small', text: 'Delete', onclick: function () { if (confirm('Delete this note?')) call('deleteNote', n.id).then(onChange); } })
  ]);
  return el('div', { cls: 'item' }, [
    el('div', { cls: 't', text: (n.pinned ? '★ ' : '') + (n.title || n.text.split('\n')[0].slice(0, 90)) }),
    el('div', { cls: 'm', text: meta }), body,
    facts.length ? el('div', { cls: 'm', text: facts.join('  |  ') }) : null, acts
  ]);
}

function mailItem(m, colours, onChange) {
  var acts = el('div', { cls: 'acts' }, [
    el('button', { cls: 'btn small', text: 'Open in Gmail', onclick: function () { window.open(m.link, '_blank'); call('setMailRead', m.id, true); } }),
    el('button', { cls: 'btn ghost small', text: m.read ? 'Mark unread' : 'Mark read', onclick: function () { call('setMailRead', m.id, !m.read).then(onChange); } }),
    el('button', { cls: 'btn ghost small', text: 'Important', onclick: function () { call('markImportant', m.id, true).then(function () { toast('Learned: mail from this sender matters more.'); onChange(); }); } }),
    el('button', { cls: 'btn ghost small', text: 'Not important', onclick: function () { call('markImportant', m.id, false).then(function () { toast('Learned: this sender matters less.'); onChange(); }); } }),
    el('button', { cls: 'btn ghost small', text: 'Save to memory', onclick: function () { call('mailToMemory', m.id).then(function () { toast('Saved to memory.'); }); } }),
    el('button', { cls: 'btn ghost small', text: 'Draft reply (AI)', onclick: function () {
      var ins = prompt('What should the reply say? (optional)', '');
      if (ins === null) return;
      toast('Jarvis is drafting...');
      call('draftReplyById', m.id, ins).then(function (d) { alert('Saved in Gmail > Drafts (not sent):\n\n' + d); });
    } }),
    el('button', { cls: 'btn ghost small', text: 'Make task', onclick: function () {
      var d = prompt('Due date (YYYY-MM-DD), or leave empty:', '');
      call('saveTask', { title: m.subject, due: d || '', source: 'Mail ' + m.id }).then(function () { toast('Task added.'); });
    } })
  ]);
  return el('div', { cls: 'item' + (m.read ? '' : ' unread') }, [
    el('div', { cls: 't', text: (m.flags ? '⚠ ' : '') + m.subject }),
    el('div', { cls: 'm' }, [acctChip(m.account, colours), ' ' + m.from + ' · ' + m.date + ' · ' + m.category]),
    m.flags ? el('div', { cls: 'm over', text: 'Security shield: ' + m.flags + '. Do not click links or share details.' }) : null,
    el('div', { cls: 'x muted', text: m.summary }), acts
  ]);
}

function taskItem(t, onChange) {
  var acts = el('div', { cls: 'acts' });
  if (t.status === 'Suggested') {
    acts.appendChild(el('button', { cls: 'btn small', text: 'Accept', onclick: function () { call('setTaskStatus', t.id, 'Open').then(onChange); } }));
    acts.appendChild(el('button', { cls: 'btn ghost small', text: 'Ignore', onclick: function () { call('deleteTask', t.id).then(onChange); } }));
  } else if (t.status !== 'Done') {
    acts.appendChild(el('button', { cls: 'btn small', text: 'Done', onclick: function () { call('setTaskStatus', t.id, 'Done').then(onChange); } }));
    acts.appendChild(el('button', { cls: 'btn ghost small', text: 'Delete', onclick: function () { call('deleteTask', t.id).then(onChange); } }));
  } else {
    acts.appendChild(el('button', { cls: 'btn ghost small', text: 'Reopen', onclick: function () { call('setTaskStatus', t.id, 'Open').then(onChange); } }));
  }
  return el('div', { cls: 'item' }, [
    el('div', { cls: 't', text: t.title }),
    el('div', { cls: t.overdue ? 'm over' : 'm', text: (t.dueLabel ? (t.overdue ? 'Overdue · ' : 'Due ') + t.dueLabel : 'No due date') + ' · ' + t.source }),
    acts
  ]);
}

function showHome() {
  var p = page('Home', '');
  loading(p);
  call('getHome').then(function (h) {
    p = page(h.greeting + ', Ritesh', h.date);
    setBadges(h.counts.unread, h.due.length);
    p.appendChild(el('div', { cls: 'stat' }, [
      el('div', {}, [el('b', { text: String(h.due.length) }), el('span', { text: 'tasks due' })]),
      el('div', {}, [el('b', { text: String(h.counts.unread) }), el('span', { text: 'unread mails' })]),
      el('div', {}, [el('b', { text: String(h.counts.notes) }), el('span', { text: 'things in memory' })]),
      el('div', {}, [el('b', { text: String(h.suggested) }), el('span', { text: 'suggested tasks' })])
    ]));
    var quick = el('textarea', { placeholder: 'Quick note... e.g. Rahul bday 14 March #family' });
    if (h.suspicious) p.appendChild(el('div', { cls: 'card', style: 'border-color:var(--bad)' }, [el('b', { cls: 'over', text: '⚠ ' + h.suspicious + ' suspicious mail(s) flagged by the security shield.' }), el('p', { cls: 'muted', text: 'Open Inbox > Suspicious. Do not click their links or share any details.' })]));

function showJarvis() {
  var p = page('Jarvis', 'Your personal assistant. Tell it what to do: it saves, reminds, plans, checks mail and answers from your memory.');
  var head = el('div', { cls: 'row', style: 'margin-bottom:10px' });
  var mode = el('span', { cls: 'aimode', text: 'AI mode: checking...' });
  head.appendChild(mode);
  head.appendChild(el('button', { cls: 'btn ghost small', text: 'Clear chat', onclick: function () { if (confirm('Clear the conversation?')) call('clearChat').then(showJarvis); } }));
  p.appendChild(head);
  var chips = el('div', { style: 'margin-bottom:10px' });
  ['Good morning', 'What\'s due?', 'Any important mail?', 'Check my mail', 'Remind me to ', 'Remember ', 'Help'].forEach(function (c) {
    chips.appendChild(el('button', { cls: 'chip', text: c.trim(), onclick: function () {
      if (/ $/.test(c)) { input.value = c; input.focus(); } else { send(c); }
    } }));
  });
  p.appendChild(chips);
  var log = el('div', { cls: 'chat' });
  p.appendChild(log);
  var input = el('textarea', { placeholder: 'Talk to Jarvis... (Enter to send, Shift+Enter for a new line)' });
  var btn = el('button', { cls: 'btn', text: 'Send' });
  p.appendChild(el('div', { cls: 'composer' }, [input, btn]));
  function bubble(text, who, extra) {
    var b = el('div', { cls: 'bubble ' + who, text: text });
    if (who === 'jv' && text !== '...') { b.className = 'bubble jv fmt'; b.innerHTML = fmtReply(text); }
    if (extra && extra.length) b.appendChild(el('div', { cls: 'm', style: 'margin-top:6px', text: 'From memory: ' + extra.join(' | ') }));
    log.appendChild(b);
    window.scrollTo(0, document.body.scrollHeight);
    return b;
  }
  function send(text) {
    text = String(text || input.value).trim();
    if (!text) return;
    input.value = '';
    bubble(text, 'me');
    var wait = bubble('...', 'jv');
    btn.disabled = true;
    call('jarvis', text).then(function (r) {
      wait.remove();
      bubble(r.text, 'jv', r.results);
      btn.disabled = false;
      if (/task|done|remind/i.test(text)) call('getHome').then(function (h) { setBadges(h.counts.unread, h.due.length); });
    }).catch(function () { wait.remove(); btn.disabled = false; });
  }
  btn.addEventListener('click', function () { send(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  call('getAISettings').then(function (s) {
    mode.textContent = s.on && s.hasKey ? 'AI mode: ON (' + s.provider + ')' : 'AI mode: off (commands only, fully private)';
    mode.classList.toggle('on', s.on && s.hasKey);
  });
  call('getChat').then(function (h) {
    if (!h.length) bubble('Good to see you, Ritesh. Tell me what you need, for example "remind me to submit the audit report on Friday" or "good morning". Type "help" to see everything I can do.', 'jv');
    h.forEach(function (m) { bubble(m.text, m.role === 'user' ? 'me' : 'jv'); });
    input.focus();
  });
}

var KIND_ICON = { briefing: '☀️', reminder: '⏰', mail: '✉️', security: '⚠️', info: '🔔' };
var alertsSeen = null;
function drawBadge(n) {
  ['b-alerts', 'b-bell'].forEach(function (id) { var b = $(id); b.textContent = n > 99 ? '99+' : String(n); b.classList.toggle('hide', !n); });
}
function chime() {
  try {
    var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    var c = chime.ctx || (chime.ctx = new A());
    [880, 1320].forEach(function (f, i) {
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i * 0.18;
      o.frequency.value = f; g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.5);
    });
  } catch (e) {}
}
function popAlert(n) {
  var box = el('div', { cls: 'pop k-' + n.kind });
  box.appendChild(el('b', { text: (KIND_ICON[n.kind] || '🔔') + ' ' + n.title }));
  if (n.text) box.appendChild(el('div', { cls: 'muted', text: n.text.slice(0, 180) + (n.text.length > 180 ? '...' : '') }));
  box.appendChild(el('div', { cls: 'acts' }, [
    el('button', { cls: 'btn small', text: 'Open', onclick: function () { box.remove(); go('alerts'); } }),
    el('button', { cls: 'btn ghost small', text: 'Dismiss', onclick: function () { box.remove(); } })]));
  $('pops').appendChild(box);
  setTimeout(function () { if (box.parentNode) box.remove(); }, 30000);
  try { if (window.Notification && Notification.permission === 'granted') new Notification('Jarvis: ' + n.title, { body: n.text.slice(0, 200) }); } catch (e) {}
}
var pollBusy = false, pollLast = 0;
function pollAlerts(force) {
  var now = Date.now();
  if (pollBusy) return;
  if (!force && (document.hidden || now - pollLast < 45000)) return;
  pollBusy = true; pollLast = now;
  google.script.run.withSuccessHandler(function (r) {
    pollBusy = false;
    drawBadge(r.unread);
    var newest = r.items.length ? r.items[0].ms : 0;
    if (alertsSeen === null) {
      if (r.unread) toast('You have ' + r.unread + ' unread alert(s). Click the bell to see them.');
    } else {
      var fresh = r.items.filter(function (n) { return n.ms > alertsSeen && !n.read; }).reverse();
      fresh.slice(-3).forEach(popAlert);
      if (fresh.length) { chime(); if (state.page === 'alerts') drawAlerts(r); }
    }
    alertsSeen = Math.max(alertsSeen || 0, newest);
  }).withFailureHandler(function () { pollBusy = false; }).getNotifications();
}
function askDesktop() {
  try {
    if (!window.Notification) throw new Error('none');
    Notification.requestPermission().then(function (s) {
      toast(s === 'granted' ? 'Desktop pop-ups are on.' : 'The browser blocked desktop pop-ups here. In-page alerts and Telegram still work.');
    });
  } catch (e) { toast('Desktop pop-ups are not available here. In-page alerts and Telegram still work.'); }
}
function showAlerts() {
  var p = page('Alerts', '');
  loading(p);
  call('getNotifications').then(drawAlerts);
}
function drawAlerts(r) {
  drawBadge(r.unread);
  var p = page('Alerts', 'Jarvis\'s own notifications: reminders, briefing, important and suspicious mail. No email is used; they also go to Telegram if paired.');
  p.appendChild(el('div', { cls: 'acts', style: 'margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap' }, [
    el('button', { cls: 'btn', text: 'Mark all read', onclick: function () { call('markNotificationsRead', 'all').then(drawAlerts); } }),
    el('button', { cls: 'btn ghost', text: 'Clear all', onclick: function () { if (confirm('Delete all alerts?')) call('clearNotifications').then(drawAlerts); } }),
    el('button', { cls: 'btn ghost', text: 'Desktop pop-ups', onclick: askDesktop })]));
  p.appendChild(card('', r.items.length ? r.items.map(alertItem) : [el('p', { cls: 'muted', text: 'No alerts yet. Reminders, the morning briefing and important mail will show up here.' })]));
}
function alertItem(n) {

  return el('div', { cls: 'item' + (n.read ? '' : ' unread') }, [
    el('div', { cls: 't', text: (KIND_ICON[n.kind] || '🔔') + ' ' + n.title }),

}

setInterval(function () { pollAlerts(false); }, 120000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) pollAlerts(false); });
