<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Jarvis</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --line:#23314f; --text:#e6edf8; --muted:#94a3c0; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:"Segoe UI",Roboto,Arial,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 24px; text-align:center; }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:2px; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 20px; }
  a.btn { display:block; background:var(--accent); color:#04121f; text-decoration:none; font-weight:700; padding:12px 16px; border-radius:10px; }
  a.btn:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  small { display:block; margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <main class="card">
    <h1>JARVIS<span>.</span></h1>
    <p>Private assistant. Opening the secure Google sign-in&hellip;</p>
    <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbwBsevvk8x1u0TO47yz4ot4DbbWYlgHAVshB9cR433GkevgcL-TpSF7lPRw9wz5MslF/exec">Sign in with Google</a>
    <small>Only the owner's Google account is allowed in.</small>
  </main>
  <script>
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 600);
  </script>
</body>
</html>
